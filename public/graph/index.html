<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snipe graph</title>
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <div id="panel" class="panel hidden" aria-live="polite"></div>
    <div class="hud">
      <div id="graphSearchWrap" class="graph-search-wrap hidden">
        <label class="sr-only" for="graphSearch">Search players</label>
        <input
          type="search"
          id="graphSearch"
          placeholder="Search players…"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <button type="button" id="resetViewBtn" class="secondary hidden">Full graph</button>
      <a class="secondary hall-nav" href="../hof/">Hall of fame</a>
    </div>
    <div id="graphMount"></div>

    <script src="app.js"></script>
  </body>
</html>
