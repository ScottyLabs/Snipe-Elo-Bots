<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hall of fame — Snipe ELO</title>
    <link rel="icon" href="../graph/logo.png" type="image/png" />
    <link rel="stylesheet" href="../graph/styles.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="hall-header">
      <div class="hall-brand">
        <img src="../graph/logo.png" alt="" width="40" height="40" onerror="this.style.display='none'" />
        <div>
          <h1 class="hall-title">Hall of fame</h1>
          <p id="guildLine" class="muted hall-sub"></p>
        </div>
      </div>
      <div class="hall-actions">
        <a class="hall-link" href="../graph/">Snipe graph</a>
      </div>
    </header>

    <main id="main" class="hall-main hidden">
      <p id="emptyHint" class="muted hall-empty hidden">
        No season archives here yet. When your organizers publish a snapshot, it will show up in this list.
      </p>
      <div id="cycles" class="hall-cycles"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
